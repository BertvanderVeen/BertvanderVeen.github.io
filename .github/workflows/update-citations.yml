name: Update Google Scholar

on:
  schedule:
    - cron: "0 0 * * *" # Daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      # with:
      #   token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync publications from Google Scholar
        run: python bin/update_scholar_publications.py

      - name: Update citation counts
        run: python bin/update_scholar_citations.py

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib _data/citations.yml
          if ! git diff --staged --quiet; then
            git commit -m "Update Google Scholar publications and citations"
            git push
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly.
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
