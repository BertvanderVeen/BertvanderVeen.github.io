name: Update Google Scholar

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      # with:
      #   token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync publications from Google Scholar
        shell: bash
        run: |
          set +e
          python bin/update_scholar_publications.py
          status=$?
          if [ $status -eq 0 ]; then
            echo "Publications sync succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "Publications sync failed with exit code $status." >> $GITHUB_STEP_SUMMARY
          fi
          set -e

      - name: Update citation counts
        shell: bash
        run: |
          set +e
          python bin/update_scholar_citations.py
          status=$?
          if [ $status -eq 0 ]; then
            echo "Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "Citation update failed with exit code $status." >> $GITHUB_STEP_SUMMARY
          fi
          set -e

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib _data/citations.yml
          git diff --staged --quiet || (
            git commit -m "Update Google Scholar publications and citations"
            git push
          )
