name: Update publications

on:
  schedule:
    - cron: "0 0 1,15 * *" # 1st and 15th of each month
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      # with:
      #   token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      # Uses only the standard library, so no dependencies to install.
      - name: Add new publications from OpenAlex
        run: python bin/update_publications.py

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          if ! git diff --staged --quiet; then
            git commit -m "Update publications from OpenAlex"
            git push
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly.
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
