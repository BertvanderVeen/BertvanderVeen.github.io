name: Update Publications from Google Scholar

on:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Uncomment below and set a PAT secret to trigger the deploy workflow after push:
        # with:
        #   token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current papers.bib hash
        id: before
        run: |
          if [ -f _bibliography/papers.bib ]; then
            echo "sha_before=$(sha256sum _bibliography/papers.bib | awk '{print $1}')" >> $GITHUB_OUTPUT
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
          fi

      - name: Fetch publications from Google Scholar
        run: |
          echo "🎓 Running publication sync..."
          timeout 180 python bin/update_scholar_publications.py

      - name: Report changes
        run: |
          if [ -f _bibliography/papers.bib ]; then
            sha_after=$(sha256sum _bibliography/papers.bib | awk '{print $1}')
            if [ "${{ steps.before.outputs.sha_before }}" != "$sha_after" ]; then
              echo "✅ _bibliography/papers.bib was updated." | tee -a $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ _bibliography/papers.bib is unchanged." | tee -a $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "Update publications from Google Scholar"
            git push
          )
